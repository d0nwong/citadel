name: release-please

on:
  push:
    branches:
      - yickkiuleung/lia-13-run-actual-dev-job-locally

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
