# Foundry's postgres, included by citadel's root compose.yaml (`just up`).

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foundry}
      POSTGRES_DB: ${POSTGRES_DB:-foundry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker, so mount the
      # image's own VOLUME rather than the pre-18 /var/lib/postgresql/data path.
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foundry} -d ${POSTGRES_DB:-foundry}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    labels:
      dev.orbstack.domains: postgres.foundry.local

volumes:
  pgdata:
    # The volume Foundry has always used, so its jobs and repos survive the move. A trial
    # stack points POSTGRES_VOLUME at a throwaway one; `just up` refuses a volume that a
    # container from another project is using.
    name: ${POSTGRES_VOLUME:-foundry-pgdata}
