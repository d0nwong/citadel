# Local development stack for foundry. Brought up by `bun run infra:up`.
name: foundry

services:
  postgres:
    image: postgres:18-alpine
    container_name: foundry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foundry}
      POSTGRES_DB: ${POSTGRES_DB:-foundry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker, so mount the
      # image's own VOLUME rather than the pre-18 /var/lib/postgresql/data path.
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foundry} -d ${POSTGRES_DB:-foundry}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    labels:
      dev.orbstack.domains: postgres.foundry.local

  # MCP gateway. Holds the real third-party credentials (Linear, Slack) so
  # forges only ever see a gateway token. Profile `mcp` is switched on by
  # infra.sh when ~/.foundry/env carries at least one upstream key
  # (`foundry auth --linear` / `--slack`); the config is committed and
  # secret-free — mcp-proxy expands ${VARS} from this env. An upstream whose
  # key is absent simply fails to mount and the rest keep serving.
  mcp:
    image: ghcr.io/tbxark/mcp-proxy:latest
    container_name: foundry-mcp
    profiles: [mcp]
    restart: unless-stopped
    environment:
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      SLACK_MCP_TOKEN: ${SLACK_MCP_TOKEN:-}
      FOUNDRY_MCP_TOKEN: ${FOUNDRY_MCP_TOKEN:-}
    volumes:
      - ./mcp/config.json:/config/config.json:ro
    ports:
      - "${MCP_PORT:-9090}:9090"
    healthcheck:
      # The image is python-slim without curl; /_readyz is 503 until startup
      # settles and at least one upstream is mounted (an upstream without its
      # key just stays unmounted), and urlopen raises on non-2xx.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/_readyz', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    labels:
      dev.orbstack.domains: mcp.foundry.local

volumes:
  pgdata:
    name: foundry-pgdata
