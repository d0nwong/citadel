# Pensieve, included by citadel's root compose.yaml (`just up`). Built from the repo root, so
# the workspace's lockfile installs it and argus's code comes along.
services:
  pensieve:
    profiles: [pensieve]
    build:
      context: ../..
      dockerfile: apps/pensieve/Dockerfile
      args:
        # Build time, not runtime: the bundle carries it. Changing it needs `just rebuild`.
        VITE_LINEAR_WORKSPACE: ${LINEAR_WORKSPACE:-liamai}
    image: citadel/pensieve:local
    ports:
      - "${PENSIEVE_PORT:-3778}:3778"
    environment:
      WORKSPACE_DIR: /argus-data
      ARGUS_DIR: /app/apps/argus
      PENSIEVE_HOME: /data
      # Only the keys Pensieve reads, never the Slack token: an Ask run inherits all of this.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      FOUNDRY_API_TOKEN: ${FOUNDRY_API_TOKEN:-}
      # Foundry as the container reaches it: the host's published port.
      FOUNDRY_URL: ${PENSIEVE_FOUNDRY_URL:-http://host.docker.internal:3777}
      # Ask's Slack and Linear servers (argus's .mcp.json): the gateway, by service name. Its
      # token arrives as a file (secrets, below): Claude Code runs the headersHelper without
      # any variable that looks like a secret.
      MCP_GATEWAY_URL: http://mcp:9090
      FE_REPO: /repos/fe
      BE_REPO: /repos/be
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # argus's data, read and written through argus's verbs (a click writes one ledger).
      # Until cutover it is the host checkout; after it, the volume the sweep shares.
      - ${ARGUS_DATA_DIR:-~/git/citadel-data}:/argus-data
      - ${FE_REPO_HOST:-~/git/alden-portal-fe}:/repos/fe:ro
      - ${BE_REPO_HOST:-~/git/alden-connect-portal-be}:/repos/be:ro
      - pensieve-home:/data
      - pensieve-claude:/root/.claude
    secrets:
      - mcp_gateway_token
    depends_on:
      mcp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pensieve-home:
  pensieve-claude:

secrets:
  mcp_gateway_token:
    environment: MCP_GATEWAY_TOKEN
