# The MCP gateway: one mcp-proxy holding the upstream keys (SLACK_TOKEN, LINEAR_API_KEY)
# and serving Slack's and Linear's hosted MCP servers at :9090/{slack,linear}/mcp behind
# MCP_GATEWAY_TOKEN. Every Claude session is a client: argus's .mcp.json (the sweep's
# model steps, Pensieve's Ask) and Foundry's forges (host.docker.internal:9090).
# Included by citadel's root compose.yaml (`just up`), which hands this file the root .env
# for interpolation, so no key is exported into a shell. The config is committed and secret-free;
# mcp-proxy expands the ${VARS} in it from this environment.
services:
  mcp:
    # Pinned to the digest Foundry's foundry-mcp ran (latest on 2026-09-11).
    image: ghcr.io/tbxark/mcp-proxy@sha256:8f795699e24a4d86f2808efc6c8292e3cf4d5ee8f6baf06854c61d451ad497b0
    restart: unless-stopped
    environment:
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      MCP_GATEWAY_TOKEN: ${MCP_GATEWAY_TOKEN:-}
    volumes:
      - ./mcp/config.json:/config/config.json:ro
    ports:
      - "${MCP_PORT:-9090}:9090"
    healthcheck:
      # Healthy once every upstream in config.json is mounted. mcp-proxy registers a route only
      # after its upstream connects (Linear takes seconds): a mounted route answers 401 without
      # the token, an unmounted one 404. /_readyz turns ready after the first upstream, too
      # early for a client that needs both. python-slim has no curl.
      test:
        - CMD
        - python3
        - -c
        - |
          import json, urllib.request as u, urllib.error as e
          for name in json.load(open("/config/config.json"))["mcpServers"]:
              try:
                  u.urlopen(u.Request(f"http://127.0.0.1:9090/{name}/mcp", data=b"{}", method="POST"), timeout=3)
              except e.HTTPError as x:
                  if x.code == 404:
                      raise SystemExit(f"{name} is not mounted yet")
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

  sweep:
    # argus's /sweep every SWEEP_INTERVAL seconds (infra/sweep/loop.sh). Behind a profile, so a
    # bare `docker compose up` leaves it off; `just up` names the profile after its preflight
    # checks that no host loop is already writing.
    profiles: [sweep]
    build:
      context: ../../..
      dockerfile: apps/argus/Dockerfile
    image: citadel/sweep:local
    environment:
      ARGUS_ROOT: /argus-data
      MCP_GATEWAY_URL: http://mcp:9090
      ALDEN_FE_REPO: /home/bun/git/alden-portal-fe
      ALDEN_BE_REPO: /home/bun/git/alden-connect-portal-be
      # The model reads Slack and can see every variable here, so it is only what the sweep
      # needs: Claude, Slack, Linear and Trello (reconcile reads ticket states; argus never
      # writes a ticket), and a read-only Bitbucket pair. The push token is a secret file.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      BITBUCKET_USERNAME: ${BITBUCKET_USERNAME:-}
      BITBUCKET_TOKEN: ${BITBUCKET_TOKEN:-}
      BITBUCKET_GIT_USERNAME: ${BITBUCKET_GIT_USERNAME:-x-bitbucket-api-token-auth}
      ARGUS_DATA_REPO: ${ARGUS_DATA_REPO:-https://github.com/d0nwong/citadel-data.git}
      SWEEP_INTERVAL: ${SWEEP_INTERVAL:-900}
      SWEEP_MODEL: ${SWEEP_MODEL:-claude-sonnet-5}
      # `argus commit` authors a tick's commit "argus sweep" itself; these only override that.
      SWEEP_GIT_NAME: ${SWEEP_GIT_NAME:-}
      SWEEP_GIT_EMAIL: ${SWEEP_GIT_EMAIL:-}
    secrets:
      - mcp_gateway_token
      - gh_token
    volumes:
      - ${ARGUS_DATA_DIR:-~/git/citadel-data}:/argus-data
      - sweep-product:/home/bun/git
      - sweep-claude:/home/bun/.claude
    depends_on:
      mcp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sweep-product:
  sweep-claude:

secrets:
  mcp_gateway_token:
    environment: MCP_GATEWAY_TOKEN
  gh_token:
    environment: GH_TOKEN
