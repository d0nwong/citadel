# The MCP gateway: one mcp-proxy holding the upstream keys (SLACK_TOKEN, LINEAR_API_KEY)
# and serving Slack's and Linear's hosted MCP servers at :9090/{slack,linear}/mcp behind
# MCP_GATEWAY_TOKEN. Every Claude session is a client: argus's .mcp.json (the sweep's
# model steps, Pensieve's Ask) and Foundry's forges (host.docker.internal:9090).
# Included by citadel's root compose.yaml (`just up`), which hands this file the root .env
# for interpolation, so no key is exported into a shell. The config is committed and secret-free;
# mcp-proxy expands the ${VARS} in it from this environment.
services:
  mcp:
    # Pinned to the digest Foundry's foundry-mcp ran (latest on 2026-09-11).
    image: ghcr.io/tbxark/mcp-proxy@sha256:8f795699e24a4d86f2808efc6c8292e3cf4d5ee8f6baf06854c61d451ad497b0
    restart: unless-stopped
    environment:
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      MCP_GATEWAY_TOKEN: ${MCP_GATEWAY_TOKEN:-}
    volumes:
      - ./mcp/config.json:/config/config.json:ro
    ports:
      - "${MCP_PORT:-9090}:9090"
    healthcheck:
      # Healthy once every upstream in config.json is mounted. mcp-proxy registers a route only
      # after its upstream connects (Linear takes seconds): a mounted route answers 401 without
      # the token, an unmounted one 404. /_readyz turns ready after the first upstream, too
      # early for a client that needs both. python-slim has no curl.
      test:
        - CMD
        - python3
        - -c
        - |
          import json, urllib.request as u, urllib.error as e
          for name in json.load(open("/config/config.json"))["mcpServers"]:
              try:
                  u.urlopen(u.Request(f"http://127.0.0.1:9090/{name}/mcp", data=b"{}", method="POST"), timeout=3)
              except e.HTTPError as x:
                  if x.code == 404:
                      raise SystemExit(f"{name} is not mounted yet")
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
